version: "3.9"

services:
  web:
    container_name: osi-osi-dev
    build: .
    ports:
      - "5173:5173"
    # Montamos el proyecto y dejamos node_modules dentro del contenedor
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
